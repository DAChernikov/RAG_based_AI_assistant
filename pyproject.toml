[project]
name = "rag-based-ai-assistant"
version = "0.1.0"
description = "RAG based AI assistant with FastAPI API and Telegram bot"
authors = [
    { name = "DAChernikov", email = "129949710+DAChernikov@users.noreply.github.com" }
]
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = []

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[[tool.poetry.source]]
name = "PyPI"
priority = "primary"

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[tool.poetry.group.api.dependencies]
fastapi = "0.139.2"
uvicorn = { version = "0.30.6", extras = ["standard"] }
pydantic = "2.9.2"
pydantic-settings = "2.5.2"
python-multipart = "0.0.32"
httpx = "0.28.1"
idna = "3.18"
psycopg = { version = "3.2.4", extras = ["binary"] }
sqlalchemy = "2.0.36"
alembic = "1.14.0"
redis = "5.2.1"
argon2-cffi = "23.1.0"
pyjwt = "2.13.0"
defusedxml = "0.7.1"
sqlglot = "30.13.0"
pgvector = "0.4.2"
prometheus-client = "0.22.1"
opentelemetry-api = "1.38.0"
opentelemetry-sdk = "1.38.0"
opentelemetry-exporter-otlp-proto-http = "1.38.0"

[tool.poetry.group.embedding.dependencies]
sentence-transformers = "5.4.1"
transformers = "5.15.0"
torch = [
    { version = "2.13.0", source = "PyPI", markers = "sys_platform == 'darwin'" },
    { version = "2.13.0+cpu", source = "pytorch-cpu", markers = "sys_platform == 'linux'" },
    { version = "2.13.0", source = "PyPI", markers = "sys_platform != 'darwin' and sys_platform != 'linux'" },
]
setuptools = "83.0.0"

[tool.poetry.group.artifacts.dependencies]
boto3 = "1.40.45"
urllib3 = "2.7.0"

[tool.poetry.group.research.dependencies]
pandas = "2.2.3"
psutil = "6.1.0"
nbformat = "5.10.4"

[tool.poetry.group.bot.dependencies]
python-telegram-bot = "22.4"
httpx = "0.28.1"
pydantic = "2.9.2"
pydantic-settings = "2.5.2"

[tool.poetry.group.dev.dependencies]
pytest = "9.1.1"
pytest-asyncio = "1.4.0"
ruff = "0.6.7"
black = "26.5.1"
isort = "5.13.2"
pytest-cov = "7.1.0"
mypy = "1.17.1"
bandit = "1.8.6"
pip-audit = "2.10.1"
vulture = "2.14"
cyclonedx-bom = "7.3.1"
cyclonedx-python-lib = "11.12.0"
lxml = "6.1.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: requires local PostgreSQL and Redis",
]
filterwarnings = [
    "ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
]

[tool.black]
line-length = 100
target-version = ["py311"]
# Released migrations remain byte-for-byte immutable; style applies to every new migration.
extend-exclude = '''(?x)(
  web/(node_modules|dist|playwright-report|test-results)
  | migrations/versions/(20260731_02_authentication_rbac|20260817_07_hybrid_index)\.py
)'''

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
exclude = ["web/node_modules", "web/dist", "web/playwright-report", "web/test-results"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
strict_optional = false
allow_redefinition = true
allow_untyped_globals = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
disable_error_code = ["misc"] # Redis/sqlglot stubs expose incomplete third-party unions.

[tool.bandit]
exclude_dirs = ["tests", ".venv", "research"]
skips = ["B101"] # Assertions are retained in application invariants and never parse user input.
