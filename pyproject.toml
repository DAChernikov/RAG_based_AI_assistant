[project]
name = "rag-based-ai-assistant"
version = "0.1.0"
description = "RAG based AI assistant with FastAPI API and Telegram bot"
authors = [
    { name = "DAChernikov", email = "129949710+DAChernikov@users.noreply.github.com" }
]
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = []

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[tool.poetry.group.api.dependencies]
fastapi = "0.115.0"
uvicorn = { version = "0.30.6", extras = ["standard"] }
pydantic = "2.9.2"
pydantic-settings = "2.5.2"
python-multipart = "0.0.9"
httpx = "0.27.2"
psycopg = { version = "3.2.4", extras = ["binary"] }
sqlalchemy = "2.0.36"
alembic = "1.14.0"
redis = "5.2.1"

[tool.poetry.group.worker.dependencies]
numpy = "2.1.1"
joblib = "1.4.2"
sentence-transformers = "5.4.1"
boto3 = "1.40.45"
botocore = "1.40.45"
torch = [
    { version = "2.9.0", markers = "sys_platform == 'darwin'" },
    { version = "2.9.0+cpu", source = "pytorch-cpu", markers = "sys_platform == 'linux'" },
]

[tool.poetry.group.research.dependencies]
pandas = "2.2.3"
psutil = "6.1.0"
nbformat = "5.10.4"

[tool.poetry.group.bot.dependencies]
python-telegram-bot = "22.4"
httpx = "0.27.2"
pydantic = "2.9.2"
pydantic-settings = "2.5.2"

[tool.poetry.group.dev.dependencies]
pytest = "8.3.3"
pytest-asyncio = "0.24.0"
ruff = "0.6.7"
black = "24.8.0"
isort = "5.13.2"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: requires local PostgreSQL and Redis",
]
filterwarnings = [
    "ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
]

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
