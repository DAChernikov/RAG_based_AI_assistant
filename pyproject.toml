[project]
name = "rag-based-ai-assistant"
version = "0.1.0"
description = "RAG-based AI assistant MVP with FastAPI API and Telegram bot"
authors = [
    { name = "DAChernikov", email = "129949710+DAChernikov@users.noreply.github.com" }
]
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "typing-extensions==4.15.0",
    "numpy==2.1.1",
    "pandas==2.2.3",
    "joblib==1.4.2",
    "sentence-transformers==5.2.3",
    "transformers==5.2.0",
    "tokenizers==0.22.1",
    "torch==2.9.0",
    "accelerate==1.11.0",
    "sentencepiece==0.2.1",
    "boto3==1.40.45",
    "botocore==1.40.45",
    "python-multipart==0.0.9",
    "httpx==0.27.2"
]

[tool.poetry]
package-mode = false

[tool.poetry.group.bot.dependencies]
python-telegram-bot = "22.4"

[tool.poetry.group.dev.dependencies]
pytest = "8.3.3"
pytest-asyncio = "0.24.0"
ruff = "0.6.7"
black = "24.8.0"
isort = "5.13.2"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"