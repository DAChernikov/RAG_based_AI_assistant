[project]
name = "rag-based-ai-assistant"
version = "0.1.0"
description = "RAG based AI assistant with FastAPI API and Telegram bot"
authors = [
    { name = "DAChernikov", email = "129949710+DAChernikov@users.noreply.github.com" }
]
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = []

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.poetry.group.api.dependencies]
fastapi = "0.115.0"
uvicorn = { version = "0.30.6", extras = ["standard"] }
pydantic = "2.9.2"
pydantic-settings = "2.5.2"
numpy = "2.1.1"
pandas = "2.2.3"
joblib = "1.4.2"
sentence-transformers = "5.2.3"
transformers = "5.2.0"
tokenizers = "0.22.1"
accelerate = "1.11.0"
sentencepiece = "0.2.1"
boto3 = "1.40.45"
botocore = "1.40.45"
python-multipart = "0.0.9"
httpx = "0.27.2"

[tool.poetry.group.bot.dependencies]
python-telegram-bot = "22.4"
httpx = "0.27.2"
pydantic = "2.9.2"
pydantic-settings = "2.5.2"

[tool.poetry.group.dev.dependencies]
pytest = "8.3.3"
pytest-asyncio = "0.24.0"
ruff = "0.6.7"
black = "24.8.0"
isort = "5.13.2"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]