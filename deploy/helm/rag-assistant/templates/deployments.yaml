{{- $root := . -}}
{{- range $component := list "api" "inference-worker" "ingestion-worker" "indexing-worker" "scheduler" "bot" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-assistant-{{ $component }}
  labels: { app.kubernetes.io/name: rag-assistant, app.kubernetes.io/component: {{ $component }} }
spec:
  replicas: {{ if or (eq $component "scheduler") (eq $component "bot") }}1{{ else }}2{{ end }}
  selector: { matchLabels: { app.kubernetes.io/name: rag-assistant, app.kubernetes.io/component: {{ $component }} } }
  template:
    metadata: { labels: { app.kubernetes.io/name: rag-assistant, app.kubernetes.io/component: {{ $component }} } }
    spec:
      serviceAccountName: rag-assistant-{{ $component }}
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: {{ $component }}
          {{- if eq $component "ingestion-worker" }}
          image: {{ include "rag.image" $root.Values.ingestionImage | quote }}
          imagePullPolicy: {{ $root.Values.ingestionImage.pullPolicy }}
          {{- else if eq $component "bot" }}
          image: {{ include "rag.image" $root.Values.botImage | quote }}
          imagePullPolicy: {{ $root.Values.botImage.pullPolicy }}
          {{- else }}
          image: {{ include "rag.image" $root.Values.commonImage | quote }}
          imagePullPolicy: {{ $root.Values.commonImage.pullPolicy }}
          {{- end }}
          {{- if eq $component "inference-worker" }}
          command: [python, -m, app.worker.main]
          {{- else if eq $component "ingestion-worker" }}
          command: [python, -m, app.ingestion_worker.main]
          {{- else if eq $component "indexing-worker" }}
          command: [python, -m, app.indexing_worker.main]
          {{- else if eq $component "scheduler" }}
          command: [python, -m, app.scheduler.main]
          {{- else if eq $component "bot" }}
          command: [python, -m, app.bot.main]
          {{- end }}
          envFrom: [{ configMapRef: { name: rag-assistant-config } }, { secretRef: { name: {{ $root.Values.existingSecret }} } }]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          resources: {{ if eq $component "api" }}{{ toYaml $root.Values.resources.api | nindent 12 }}{{ else }}{{ toYaml $root.Values.resources.worker | nindent 12 }}{{ end }}
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
          {{- if eq $component "api" }}
          ports: [{ name: http, containerPort: 8000 }]
          startupProbe: { httpGet: { path: /health, port: http }, failureThreshold: 30, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /health, port: http }, periodSeconds: 15 }
          # Keep Setup Wizard routable while product readiness reports model_loading.
          readinessProbe: { httpGet: { path: /health, port: http }, periodSeconds: 10 }
          {{- else }}
          {{- $role := trimSuffix "-worker" $component }}
          startupProbe: { exec: { command: [python, -m, app.worker_healthcheck, {{ $role }}, --readiness] }, failureThreshold: 30, periodSeconds: 5 }
          livenessProbe: { exec: { command: [python, -m, app.worker_healthcheck, {{ $role }}] }, periodSeconds: 15, timeoutSeconds: 3 }
          readinessProbe: { exec: { command: [python, -m, app.worker_healthcheck, {{ $role }}, --readiness] }, periodSeconds: 10, timeoutSeconds: 3 }
          {{- end }}
      volumes: [{ name: tmp, emptyDir: {} }]
{{- end }}
