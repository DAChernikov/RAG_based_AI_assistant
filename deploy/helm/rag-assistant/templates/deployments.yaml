{{- $root := . -}}
{{- range $component := list "api" "inference-worker" "ingestion-worker" "indexing-worker" "scheduler" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-assistant-{{ $component }}
  labels: { app.kubernetes.io/name: rag-assistant, app.kubernetes.io/component: {{ $component }} }
spec:
  replicas: {{ if eq $component "scheduler" }}1{{ else }}2{{ end }}
  selector: { matchLabels: { app.kubernetes.io/name: rag-assistant, app.kubernetes.io/component: {{ $component }} } }
  template:
    metadata: { labels: { app.kubernetes.io/name: rag-assistant, app.kubernetes.io/component: {{ $component }} } }
    spec:
      serviceAccountName: rag-assistant-{{ $component }}
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: {{ $component }}
          image: "{{ $root.Values.image.repository }}:{{ $root.Values.image.tag }}"
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          {{- if eq $component "inference-worker" }}
          command: [python, -m, app.worker.main]
          {{- else if eq $component "ingestion-worker" }}
          command: [python, -m, app.ingestion_worker.main]
          {{- else if eq $component "indexing-worker" }}
          command: [python, -m, app.indexing_worker.main]
          {{- else if eq $component "scheduler" }}
          command: [python, -m, app.scheduler.main]
          {{- end }}
          envFrom: [{ configMapRef: { name: rag-assistant-config } }, { secretRef: { name: {{ $root.Values.existingSecret }} } }]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          resources: {{ if eq $component "api" }}{{ toYaml $root.Values.resources.api | nindent 12 }}{{ else }}{{ toYaml $root.Values.resources.worker | nindent 12 }}{{ end }}
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
          {{- if eq $component "api" }}
          ports: [{ name: http, containerPort: 8000 }]
          startupProbe: { httpGet: { path: /health, port: http }, failureThreshold: 30, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /health, port: http }, periodSeconds: 15 }
          readinessProbe: { httpGet: { path: /ready, port: http }, periodSeconds: 10 }
          {{- else }}
          livenessProbe: { exec: { command: [python, -c, "import os; os.kill(1, 0)"] }, periodSeconds: 15 }
          readinessProbe: { exec: { command: [python, -c, "import os; os.kill(1, 0)"] }, periodSeconds: 10 }
          {{- end }}
      volumes: [{ name: tmp, emptyDir: {} }]
{{- end }}
