apiVersion: v1
kind: ConfigMap
metadata:
  name: rag-assistant-config
  labels:
    {{- include "rag.labels" . | nindent 4 }}
data:
  APP_ENV: {{ .Values.config.appEnv | quote }}
  AUTH_DISABLED: "false"
  AUTH_COOKIE_SECURE: "true"
  MODEL_API_BASE_URL: {{ .Values.config.modelApiBaseUrl | quote }}
  GENERATION_MODEL: {{ .Values.config.generationModel | quote }}
  EMBEDDING_API_BASE_URL: {{ .Values.config.embeddingApiBaseUrl | quote }}
  CORS_ALLOWED_ORIGINS: {{ .Values.config.corsAllowedOrigins | quote }}
