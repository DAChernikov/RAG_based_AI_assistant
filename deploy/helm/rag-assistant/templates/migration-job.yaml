apiVersion: batch/v1
kind: Job
metadata:
  name: "rag-assistant-migrate-{{ .Release.Revision }}"
  annotations: { "helm.sh/hook": "pre-install,pre-upgrade", "helm.sh/hook-delete-policy": before-hook-creation }
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: rag-assistant-api
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: migrate
          image: {{ include "rag.image" .Values.commonImage | quote }}
          imagePullPolicy: {{ .Values.commonImage.pullPolicy }}
          command: [alembic, upgrade, head]
          envFrom: [{ configMapRef: { name: rag-assistant-config } }, { secretRef: { name: {{ .Values.existingSecret }} } }]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
