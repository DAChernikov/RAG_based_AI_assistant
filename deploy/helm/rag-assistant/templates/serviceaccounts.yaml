{{- range $name := list "api" "inference-worker" "ingestion-worker" "indexing-worker" "scheduler" "bot" "embedding" "web" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rag-assistant-{{ $name }}
  labels:
    app.kubernetes.io/name: rag-assistant
    app.kubernetes.io/component: {{ $name }}
automountServiceAccountToken: false
{{- end }}
