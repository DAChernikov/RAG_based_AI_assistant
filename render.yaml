services:
  - type: web
    name: rag-ai-assistant-api
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./infra/api.Dockerfile
    healthCheckPath: /ready
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: prod
      - key: LOG_LEVEL
        value: INFO
      - key: API_HOST
        value: 0.0.0.0
      - key: API_PORT
        value: "8000"
      - key: ARTIFACTS_DIR
        value: /app/artifacts
      - key: FORCE_ARTIFACTS_DOWNLOAD
        value: "false"
      - key: DEFAULT_MODE
        value: rag
      - key: TOP_K
        value: "5"
      - key: MAX_NEW_TOKENS
        value: "1000"
      - key: DOC_MAX_NEW_TOKENS
        value: "1500"
      - key: CODE_MAX_NEW_TOKENS
        value: "2000"
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_API_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta
      - key: LLM_MODEL
        value: gemini-2.5-flash
      - key: LLM_TEMPERATURE
        value: "0.2"
      - key: LLM_MAX_CONTEXT_CHARS
        value: "12000"
      - key: LLM_RETRIES
        value: "3"
      - key: LLM_RETRY_BACKOFF_SEC
        value: "3.0"
      - key: REQUEST_TIMEOUT
        value: "90"
      - key: SQL_TOP_K
        value: "10"
      - key: SQL_SCHEMA_SOURCE
        value: database_schema
      - key: SQL_DIALECT
        value: postgres
      - key: SQL_MAX_REPAIR_ATTEMPTS
        value: "1"
      - key: SQL_MAX_NEW_TOKENS
        value: "900"
      - key: SQL_TEMPERATURE
        value: "0.0"
      - key: SQL_ENABLE_EXPLAIN_VALIDATION
        value: "true"
      - key: SQL_EXPLAIN_TIMEOUT_SEC
        value: "10"
      - key: POSTGRES_HOST
        sync: false
      - key: POSTGRES_PORT
        value: "5432"
      - key: POSTGRES_DB
        sync: false
      - key: POSTGRES_USER
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false
      - key: POSTGRES_SSLMODE
        value: require
      - key: STREAM_EDIT_INTERVAL_SEC
        value: "1.0"
      - key: STREAM_MIN_CHARS_DELTA
        value: "40"

      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ARTIFACT_KEY
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        sync: false
      - key: LLM_API_KEY
        sync: false

  - type: worker
    name: rag-ai-assistant-bot
    runtime: docker
    region: frankfurt
    plan: starter
    dockerfilePath: ./infra/bot.Dockerfile
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: prod
      - key: LOG_LEVEL
        value: INFO
      - key: REQUEST_TIMEOUT
        value: "90"
      - key: STREAM_EDIT_INTERVAL_SEC
        value: "1.0"
      - key: STREAM_MIN_CHARS_DELTA
        value: "40"
      - key: USE_MESSAGE_DRAFTS
        value: "false"
      - key: API_BASE_URL
        value: https://rag-ai-assistant-api.onrender.com
      - key: TELEGRAM_BOT_TOKEN
        sync: false
