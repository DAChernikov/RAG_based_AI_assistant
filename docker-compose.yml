name: rag-assistant

x-app-env: &app-env
  APP_ENV: ${APP_ENV:-dev}
  API_HOST: 0.0.0.0
  TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-127.0.0.1}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  AUTH_DISABLED: ${AUTH_DISABLED:-false}
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (at least 32 random characters)}
  AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
  AUTH_COOKIE_SAMESITE: ${AUTH_COOKIE_SAMESITE:-lax}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
  REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env}
  MODEL_API_BASE_URL: ${MODEL_API_BASE_URL:-http://host.docker.internal:11434/v1}
  GENERATION_MODEL: ${GENERATION_MODEL:-qwen2.5-coder:14b}
  MODEL_API_TOKEN: ${MODEL_API_TOKEN:-}
  MODEL_HTTP_ALLOWED_HOSTS: ${MODEL_HTTP_ALLOWED_HOSTS:-}
  EMBEDDING_API_BASE_URL: ${EMBEDDING_API_BASE_URL:-http://embedding-service:8001/v1}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
  EMBEDDING_MODEL_VERSION: ${EMBEDDING_MODEL_VERSION:-bge-m3/1}
  EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
  EMBEDDING_API_TOKEN: ${EMBEDDING_API_TOKEN:-}
  RERANKER_API_BASE_URL: ${RERANKER_API_BASE_URL:-}
  RERANKER_API_TOKEN: ${RERANKER_API_TOKEN:-}
  SQL_ENABLE_EXPLAIN_VALIDATION: ${SQL_ENABLE_EXPLAIN_VALIDATION:-false}
  SQL_EXPLAIN_TIMEOUT_SEC: ${SQL_EXPLAIN_TIMEOUT_SEC:-10}
  SECRET_STORE_PROVIDER: encrypted_db
  SECRET_STORE_KEY_FILE: /var/lib/rag-secrets/master.key

x-service-security: &service-security
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg16@sha256:a132765ec351c65111b5b675928a3a0515a466a40f97277329db8b8209ad8bc9
    environment:
      POSTGRES_DB: ${POSTGRES_APP_DB:-rag}
      POSTGRES_USER: ${POSTGRES_APP_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U ${POSTGRES_APP_USER:-rag} -d ${POSTGRES_APP_DB:-rag}"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7.4.2-alpine@sha256:02419de7eddf55aa5bcf49efb74e88fa8d931b4d77c07eff8a6b2144472b6952
    command: [redis-server, --appendonly, "yes", --requirepass, "${REDIS_PASSWORD:?Set REDIS_PASSWORD}", --maxmemory, 512mb, --maxmemory-policy, noeviction]
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD-SHELL, 'redis-cli -a "$${REDIS_PASSWORD}" ping | grep PONG']
      interval: 5s
      timeout: 3s
      retries: 30
    environment: { REDIS_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD}" }
    restart: unless-stopped

  migrate:
    image: ${API_IMAGE:-rag-assistant-api:local}
    build: { context: ., dockerfile: infra/api.Dockerfile }
    environment: *app-env
    command: [alembic, upgrade, head]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }

  embedding-service:
    image: ${EMBEDDING_IMAGE:-rag-assistant-embedding:local}
    build: { context: ., dockerfile: infra/embedding.Dockerfile }
    environment:
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      EMBEDDING_MODEL_VERSION: ${EMBEDDING_MODEL_VERSION:-bge-m3/1}
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-cpu}
      EMBEDDING_CONCURRENCY: ${EMBEDDING_CONCURRENCY:-1}
      # Loading starts independently; UI reports model_loading until /ready succeeds.
      EMBEDDING_WARMUP: ${EMBEDDING_WARMUP:-true}
      HF_HOME: /models/huggingface
    volumes: [model_cache:/models]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/ready', timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 20
      # First BGE-M3 download/load can take several minutes on a cold CPU host.
      start_period: ${EMBEDDING_HEALTH_START_PERIOD:-30m}
    <<: *service-security
    read_only: false
    mem_limit: ${EMBEDDING_MEMORY_LIMIT:-6g}

  api:
    image: ${API_IMAGE:-rag-assistant-api:local}
    build: { context: ., dockerfile: infra/api.Dockerfile }
    environment: *app-env
    extra_hosts: [host.docker.internal:host-gateway]
    volumes: [secret_keys:/var/lib/rag-secrets]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 20
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      embedding-service: { condition: service_started }
    <<: *service-security
    mem_limit: 768m

  inference-worker:
    image: ${WORKER_IMAGE:-rag-assistant-worker:local}
    build: { context: ., dockerfile: infra/worker.Dockerfile }
    environment: { <<: *app-env, WORKER_ID: "${WORKER_ID:-inference-worker-1}" }
    extra_hosts: [host.docker.internal:host-gateway]
    volumes: [secret_keys:/var/lib/rag-secrets]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      embedding-service: { condition: service_healthy }
    stop_grace_period: 2m
    healthcheck:
      test: [CMD, python, -m, app.worker_healthcheck, inference, --readiness]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 30s
    <<: *service-security
    mem_limit: 1g

  ingestion-worker:
    image: ${INGESTION_IMAGE:-rag-assistant-ingestion:local}
    build: { context: ., dockerfile: infra/ingestion-worker.Dockerfile }
    environment: { <<: *app-env, INGESTION_WORKER_ID: "${INGESTION_WORKER_ID:-ingestion-worker-1}" }
    volumes: [secret_keys:/var/lib/rag-secrets]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    stop_grace_period: 2m
    healthcheck:
      test: [CMD, python, -m, app.worker_healthcheck, ingestion, --readiness]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 30s
    <<: *service-security
    mem_limit: 768m

  indexing-worker:
    image: ${WORKER_IMAGE:-rag-assistant-worker:local}
    build: { context: ., dockerfile: infra/worker.Dockerfile }
    command: [python, -m, app.indexing_worker.main]
    environment: { <<: *app-env, INDEXING_WORKER_ID: "${INDEXING_WORKER_ID:-indexing-worker-1}" }
    volumes: [secret_keys:/var/lib/rag-secrets]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      embedding-service: { condition: service_healthy }
    stop_grace_period: 2m
    healthcheck:
      test: [CMD, python, -m, app.worker_healthcheck, indexing, --readiness]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 30s
    <<: *service-security
    mem_limit: 768m

  scheduler:
    image: ${WORKER_IMAGE:-rag-assistant-worker:local}
    build: { context: ., dockerfile: infra/worker.Dockerfile }
    command: [python, -m, app.scheduler.main]
    environment: { <<: *app-env, SCHEDULER_ID: "${SCHEDULER_ID:-scheduler-1}" }
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: [CMD, python, -m, app.worker_healthcheck, scheduler, --readiness]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
    <<: *service-security
    mem_limit: 384m

  web:
    image: ${WEB_IMAGE:-rag-assistant-web:local}
    build: { context: ., dockerfile: infra/web.Dockerfile }
    ports: ["${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:8080"]
    depends_on: { api: { condition: service_healthy } }
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:8080/health]
      interval: 15s
      timeout: 3s
      retries: 5
    <<: *service-security
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    mem_limit: 128m

  bot:
    image: ${BOT_IMAGE:-rag-assistant-bot:local}
    build: { context: ., dockerfile: infra/bot.Dockerfile }
    environment:
      <<: *app-env
      API_BASE_URL: http://api:8000
      BOT_CONFIG_RELOAD_INTERVAL_SEC: ${BOT_CONFIG_RELOAD_INTERVAL_SEC:-5}
    volumes: [secret_keys:/var/lib/rag-secrets]
    depends_on: { api: { condition: service_healthy } }
    healthcheck:
      test: [CMD, python, -m, app.worker_healthcheck, bot, --readiness]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
    <<: *service-security
    mem_limit: 256m

  ollama:
    image: ollama/ollama:0.5.7@sha256:4ee6d2970aad83e7e814f1bac3c0af839f3123e297cf801f526b28ff65132604
    volumes: [ollama_data:/root/.ollama]
    profiles: [cpu-model]
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  model_cache:
  ollama_data:
  secret_keys:
